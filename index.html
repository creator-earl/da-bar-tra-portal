<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DA-BAR | TRA Orientation Portal</title>
<style>*{box-sizing:border-box}html,body{margin:0;background:#f6f8f6;font-family:Arial,sans-serif}iframe{display:block;width:100%;height:100vh;min-height:900px;border:0}.message{padding:50px;text-align:center;color:#345647}</style></head>
<body><main id="portal"><div class="message">Loading TRA Orientation Portal…</div></main><script src="./config.js"></script><script>
const portal=document.getElementById('portal');const url=window.TRA_APPS_SCRIPT_URL;
