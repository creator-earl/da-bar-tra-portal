
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>DA-BAR | TRA Orientation Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #123c30;
    }

    header {
      background: #07513e;
      color: white;
      padding: 22px 8%;
      font-size: 21px;
      font-weight: bold;
    }

    main {
      width: 100%;
      min-height: 80vh;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100vh;
      min-height: 800px;
      border: none;
      background: white;
    }

    .message {
      padding: 40px 20px;
      text-align: center;
    }

    footer {
      padding: 20px;
      text-align: center;
      font-size: 13px;
      color: #587066;
    }
  </style>
</head>

<body>

  <header>
    DA-BAR · TRA Orientation Portal
  </header>

  <main id="portal">
    <div class="message">
      Loading TRA Orientation Portal...
    </div>
  </main>

  <footer>
    Department of Agriculture ·
    Bureau of Agricultural Research
  </footer>

  <script src="./config.js"></script>

  <script>
    const portal = document.getElementById("portal");

    const url = window.TRA_APPS_SCRIPT_URL;

    if (url && url.startsWith(
      "https://script.google.com/"
    )) {
      const frame = document.createElement("iframe");
      frame.src = url;
      frame.title = "DA-BAR TRA Orientation Portal";
      frame.setAttribute("allow", "clipboard-write");

      portal.replaceChildren(frame);
    } else {
      portal.textContent =
        "Portal configuration is missing. " +
        "Please contact the administrator.";
    }
  </script>

</body>
</html>
